name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the manifest version matches the tag
        run: |
          version=$(jq -r .version custom_components/hon_wine/manifest.json)
          [ "v$version" = "${{ github.event.release.tag_name }}" ] || {
            echo "manifest.json has $version, release is ${{ github.event.release.tag_name }}"; exit 1; }
      - name: Build hon_wine.zip
        run: cd custom_components/hon_wine && zip -r ../../hon_wine.zip . -x '*/__pycache__/*'
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" hon_wine.zip --clobber
